name: Quality Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Resolve non-breaking audit updates in lockfile for inspection
        run: |
          npm audit fix --package-lock-only
          git diff -- package-lock.json
      - run: npm run audit:high
      - run: npm run seo:og
      - run: npm run seo:pages
      - run: npm run seo:sitemap
      - run: npm run build
      - run: npm run test:seo-top10
      - run: npm run validate:performance
      - run: npm run validate:seo
      - run: npm run test:sitemap
      - run: npm run test:indexnow
      - run: npm run test:robots
      - run: npm run test:a11y
      - run: npm run test:i18n
      - run: npm run test:i18n-strings
      - run: npm run test:ux
      - run: npm run test:security
      - run: npm run test:blog-index
      - run: npm run test:localized-metadata
