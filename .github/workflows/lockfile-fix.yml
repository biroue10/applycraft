name: Temporary Lockfile Fix

on:
  push:
    branches: [seo/gsc-top10-growth]

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo/gsc-top10-growth
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only || true
      - name: Commit only the lockfile when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: apply non-breaking dependency audit fixes"
          git push origin HEAD:seo/gsc-top10-growth
