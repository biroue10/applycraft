    <!-- JSON-LD: FAQ (mirrors the "Common questions" section) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is ApplyCraft really free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The core builder, templates, language options, previews, and PDF or DOCX downloads are available without a paid tier, account, or credit card."
          }
        },
        {
          "@type": "Question",
          "name": "Do you store or sell my data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ApplyCraft does not require an account profile to build a resume. Standard editing and export are browser-first; optional AI and translation helpers may process the text you choose to submit."
          }
        },
        {
          "@type": "Question",
          "name": "Are the templates ATS-compatible?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The templates are designed with readable typography, clear section headings, and ATS-conscious layouts to improve parsing compatibility."
          }
        },
        {
          "@type": "Question",
          "name": "Can I write my resume in any language?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. You can write resume content in any language. Fully localized interface and document-label support is currently production-ready in English, French, and Arabic, with additional languages planned."
          }
        },
        {
          "@type": "Question",
          "name": "What download formats are available?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PDF and DOCX. PDF is ideal for most applications. DOCX is available for recruiters or employers who need an editable file."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to create an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A secure one-time email link is required to open the builder. No password or credit card is required."
          }
        }
      ]
    }
    </script>

    <style>
      /* Design tokens — mirror of src/theme/colors.js (see public/_seo.css for
         the static-page copy). Contrast is enforced by scripts/contrast-tests.mjs. */
      /* Critical scrollbar rules are inlined so first paint does not wait on a
         separate render-blocking request. The source stylesheet remains the
         canonical copy for static HTML pages. */
      html { scrollbar-gutter: auto; }
      *, *::before, *::after { -ms-overflow-style: none; scrollbar-width: none; }
      *::-webkit-scrollbar { display: none; width: 0; height: 0; background: transparent; }
      :root {
        --color-bg-canvas: #06080F;
        --color-bg-sidebar: #080D18;
        --color-bg-surface-raised: #132036;
        --color-bg-surface-hover: #172842;
        --color-bg-overlay: rgba(6,8,15,.82);
        --color-bg-header: rgba(6,8,15,.98);
        --color-bg-page: #06080F;
        --color-bg-surface: #0D1424;
        --color-bg-elevated: #132036;
        --color-text-primary: #EEF2FF;
        --color-text-secondary: #B6C2D6;
        --color-text-muted: #8B9EB8;
        --color-accent-primary: #6366F1;
        --color-accent-secondary: #818CF8;
        --color-brand: #7C3AED;
        --color-brand-strong: #A855F7;
        --color-action-primary: #7C3AED;
        --color-action-primary-hover: #6D28D9;
        --color-action-secondary: #A78BFA;
        --color-border-subtle: #20324E;
        --color-border-strong: #344967;
        --color-focus-ring: #C4B5FD;
        --color-focus-halo: rgba(167,139,250,.28);
        --font-sans: 'IBM Plex Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;
        --shadow-sm: 0 4px 14px rgba(0,0,0,.16);
        --shadow-md: 0 14px 34px rgba(0,0,0,.22);
        --transition-fast: 140ms ease;
        --transition-base: 200ms cubic-bezier(.22,1,.36,1);
      }
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: var(--color-bg-page); }
      /* Placeholders are text: they must clear 4.5:1 like any other label.
         The previous near-navy tone measured 1.56:1 against the input fill. */
      input::placeholder, textarea::placeholder { color: var(--color-text-muted); opacity: 1; }
      button { font-family: inherit; }
      input:focus, textarea:focus, select:focus {
        border-color: #6366F1 !important;
        box-shadow: 0 0 0 3px rgba(99,102,241,0.15) !important;
      }

      /* ── Animations ───────────────────────────────────────────────── */
      @keyframes acFadeUp {
        from { opacity: 0; transform: translateY(26px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes acFadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      /* Respect user preference for reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      @keyframes acPulse {
        0%, 100% { transform: scale(1); }
        50%       { transform: scale(1.025); }
      }
      @keyframes acGradientShift {
        0%, 100% { background-position: 0% 50%; }
        50%       { background-position: 100% 50%; }
      }
      .ac-card-hover {
        transition: transform 0.22s ease, box-shadow 0.22s ease !important;
      }
      .ac-card-hover:hover {
        transform: translateY(-6px) scale(1.015) !important;
        box-shadow: 0 16px 48px rgba(0,0,0,0.55) !important;
      }
      @keyframes acShake {
        0%,100% { transform: translateX(0); }
        18%     { transform: translateX(-7px); }
        36%     { transform: translateX(7px); }
        54%     { transform: translateX(-4px); }
        72%     { transform: translateX(4px); }
      }
      .ac-shake { animation: acShake 0.42s ease; }

      /* ── Skip link ── */
      .skip-link {
        position: absolute;
        top: -100%;
        left: 8px;
        z-index: 99999;
        padding: 8px 16px;
        background: #6366F1;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        border-radius: 0 0 6px 6px;
        text-decoration: none;
        transition: top 0.1s;
      }
      .skip-link:focus {
        top: 0;
        outline: 3px solid #fff;
        outline-offset: 2px;
      }

      /* ── Hero: keep the prerendered (pre-hydration) layout mobile-correct ──
         Pages are prerendered with the desktop hero (two columns, 144px top
         padding, live-preview column). Before the JS bundle hydrates, a phone
         would otherwise paint that desktop layout and push the headline below
         the fold. These rules mirror the post-hydration mobile values so the
         headline sits near the top immediately, with no layout shift. */
      @media (max-width: 768px) {
        .ac-hero-grid {
          grid-template-columns: 1fr !important;
          padding: 108px 20px 48px !important;
        }
        .ac-hero-text { text-align: center !important; }
        .ac-hero-visual { display: block !important; max-width: 100% !important; overflow: visible !important; }
        /* SSG renders before viewport hooks run, so desktop entrance animations
           are present inline in the initial HTML. Do not let those `both`
           animations hold mobile hero text at opacity:0 until hydration. */
        .ac-hero-text > *, .ac-hero-visual { animation: none !important; }

        /* Navbar: match post-hydration mobile sizing so it doesn't paint
           large then snap smaller on refresh. */
        .ac-nav-inner { height: 60px !important; padding: 0 16px !important; }
        .ac-nav-logo { font-size: 20px !important; }
        .ac-nav-cta { padding: 8px 14px !important; font-size: 13px !important; }
      }

      /* ── Screen-reader only utility ── */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>

    <!-- Cookie consent + consent-gated optional measurement.
         The consent UI is not required for first paint, so fetch it after the
         document has loaded. It owns the optional measurement lifecycle for
         the whole site; src/analytics.js only pushes product events. -->
    <script>
      addEventListener("load", () => {
        const loadConsent = () => {
          const script = document.createElement("script");
          script.src = "/consent.js";
          document.head.append(script);
        };
        if ("requestIdleCallback" in window) {
          requestIdleCallback(loadConsent, { timeout: 1500 });
        } else {
          setTimeout(loadConsent, 0);
        }
      }, { once: true });
    </script>
  </head>

    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
